    <meta name="google-site-verification" content="8xDkNMJr_jeEF5Qb89A7yPFwTqJDwkaGkcihnhSO6k4" />

    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <!--
      MOBİL KLAVYE DÜZELTMESİ — `interactive-widget=resizes-content`
      ============================================================
      SORUN: Trade-Up'ta float kutusuna dokunulduğunda ekran klavyesi açılıyor,
      eşya kartı tamamen görünmez oluyor ve yazılan değer görülemiyordu.

      KÖK NEDEN: Tarayıcıların varsayılan davranışı `resizes-visual`'dır —
      klavye açılınca DÜZEN (layout) viewport'u aynı kalır, yalnızca GÖRSEL
      viewport kayar. Bu uygulamada `body { overflow: hidden }` ve tam yükseklik
      bir kök eleman olduğu için sayfa hiç kaydırılamıyor; odaklanan kutu
      klavyenin ARKASINDA kalıyordu.

      `resizes-content` klavye açıldığında DÜZEN viewport'unu da küçültür:
      uygulamanın ScrollView'i kısalır, dolayısıyla odaklanan alan gerçekten
      kaydırılabilir hâle gelir. Bunu tamamlayan ikinci parça, odaklanınca
      kartı ekranın ORTASINA kaydıran kod: src/TradeUpScreen.js -> CompactFloatSlider.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content" />

    <!--
      SEKME BAŞLIĞI: Bu şablon olmadan başlık app.json'daki `expo.name`
      alanından ("cs2-simulator") üretiliyordu. Expo, `public/index.html`
      varsa onu şablon olarak kullanır (SDK 57, single-page çıktı) ve bundle
      script etiketini gövdenin, favicon bağlantısını da head'in sonuna
      KENDİSİ ekler — bu yüzden burada onları yazmıyoruz.

      DİKKAT — BU DOSYADA KAPANIŞ ETİKETİ YAZMAYIN (yorum içinde bile):
      Expo'nun enjeksiyonu düz metin araması yapıyor ve kapanış head/body
      etiketinin İLK geçtiği yeri hedefliyor. Bir yorumun içinde böyle bir
      metin geçerse script etiketi YORUMUN İÇİNE gömülüyor ve uygulama hiç
      açılmıyor (bu bir kez yaşandı, 29 Ağu 2026).
    -->
    <title>SkinSimulator.com</title>
    <!-- Aciklama meta etiketini Expo app.json'daki `web.description` alanindan
         KENDISI ekliyor; burada da yazarsak sayfada IKI tane olur. -->

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      ============================================================
      CS2 / TAKTİKSEL TEMA — FONT ve ZEMİN
      ============================================================
      ⚠️ ARTIK ÇALIŞMA ANINDA DEĞİŞİYOR (31 Ağu 2026): üst çubuktaki
      Güneş/Ay butonu `html[data-cs-theme]` özniteliğini değiştiriyor;
      aşağıdaki font kuralı yalnızca `cs-dark` için geçerli olduğundan
      aydınlık temada otomatik olarak sistem fontuna dönülüyor.

      ⚠️ KALICI GERİ ALMA: `src/theme.js` içindeki `DEFAULT_THEME` sabitini
      `'light'` yapın — site varsayılan olarak eski açık tasarımla açılır.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style id="cs-theme">
      :root {
        /* Tek değişken: tüm arayüz fontu buradan gelir. */
        --cs-font: 'Chakra Petch', 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --cs-bg: #14181c;
      }

      /* Sayfa zemini: parlak beyaz yerine koyu antrasit.
         ⚠️ `html`/`body` de boyanmalı — aksi hâlde kaydırma sınırında ve
         mobil "overscroll" sırasında altta beyaz bir şerit görünüyor. */
      /* İlk boyama için varsayılan; uygulama açılınca App.js paletten gelen
         gerçek değeri yazar (bkz. "TEMAYI DOM'A BİLDİR"). Bu satır yalnızca
         bundle yüklenene kadarki beyaz parlamayı önler. */
      /* ⚠️ `--c-bg` TEMA DEĞİŞKENİDİR (App.js açılışta <style id="cs-theme-vars">
         etiketini basar). `--cs-bg` yalnızca o etiket basılana kadarki BİR KARELİK
         yedektir; ikisini birden bırakmak zorunlu — sadece `--cs-bg` yazılırsa
         aydınlık temada #root koyu kalır (yaşandı, 31 Ağu 2026). */
      html,
      body,
      #root {
        background-color: var(--c-bg, var(--cs-bg));
      }

      /*
        FONTUN TÜM ARAYÜZE UYGULANMASI
        ------------------------------------------------------------
        ⚠️ react-native-web her metin düğümüne kendi font-family SINIFINI
        basar (özgüllük 0,0,1,0). Bunu geçmek için ID'li bir seçici gerekiyor
        (`#root` → 0,1,0,0) — `!important` KULLANMIYORUZ, çünkü o zaman
        aşağıdaki monospace istisnası da ezilirdi.
      */
      /* ⚠️ TEMAYA GÖRE SEÇİCİ YAZMAYIN — `--cs-font` ZATEN TEMAYA GÖRE DEĞİŞİR.
         İlk sürümde bu kural `html[data-cs-theme='cs-dark']` ile sınırlıydı;
         aydınlık temaya geçilince HİÇBİR kural eşleşmediği için tarayıcının
         varsayılanı (Times New Roman — serif!) devreye girdi (ölçüldü,
         31 Ağu 2026). Kural her temada geçerli olmalı; hangi fontun
         kullanılacağına `theme.js -> EXTRA_VARS[tema]['cs-font']` karar verir. */
      #root div:not([class*='r-fontFamily-']),
      #root span:not([class*='r-fontFamily-']),
      #root p:not([class*='r-fontFamily-']),
      #root a:not([class*='r-fontFamily-']),
      #root button:not([class*='r-fontFamily-']),
      #root input:not([class*='r-fontFamily-']),
      #root textarea:not([class*='r-fontFamily-']),
      #root h1,
      #root h2,
      #root h3 {
        font-family: var(--cs-font);
      }

      /*
        ⚠️ MONOSPACE İSTİSNASI YUKARIDAKİ `:not()` İLE SAĞLANIYOR — BOZMAYIN.
        ------------------------------------------------------------
        Bakiye, kredi ve sayaç rakamları TABULAR olmalı: rakam genişliği
        değişirse rozet her güncellemede yerinden oynar (bu proje bunu bir kez
        yaşadı — bkz. components/Icons.js ValuePill).
        react-native-web, stilde AÇIKÇA `fontFamily` verilen her öğeye
        `r-fontFamily-<hash>` sınıfı basar. Yukarıdaki kural bu sınıfa sahip
        öğeleri `:not()` ile DIŞARIDA bırakıyor, böylece onlar kendi
        font-family'lerini korur.
        ⚠️ İlk denemede `[style*='monospace']` kullanılmıştı; RN-Web font-family'yi
        inline stille DEĞİL sınıfla verdiği için hiç eşleşmedi ve monospace
        sayılar Chakra Petch'e dönüştü (ölçüldü).
      */

      /* Koyu zeminde tarayıcı kaydırma çubuğu da koyu olsun.
         ⚠️ SADECE koyu temada: `applyTheme()` bunu satır içi stille de yazar
         (satır içi kazanır) ama ilk boyamada bu kural geçerli olur. */
      html[data-cs-theme='cs-dark'],
      html:not([data-cs-theme]) {
        color-scheme: dark;
      }
      html[data-cs-theme='light'] {
        color-scheme: light;
      }
    </style>
  </head>
